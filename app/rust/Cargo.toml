[package]
name = "tt_bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
tt-core = { path = "../../core" }
anyhow = "1.0.105"
uniffi = "=0.32.2"
