[package]
name = "utre-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
rrule = "0.14.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v7"] }

[dev-dependencies]
proptest = "1.12.0"
