[package]
name = "utre-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.105"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
utre-api = { path = "../api", features = ["server"] }
utre-core = { path = "../core" }
utre-google = { path = "../google" }
utre-sync = { path = "../sync" }
serde_json = "1"
pgp = "0.21.1"
plist = "1"
semver = "1"
reqwest = "0.13.5"
serde = { version = "1", features = ["derive"] }

# The tray: a StatusNotifierItem over D-Bus, Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.7"

# Notifications everywhere but macOS: freedesktop notifications with actions.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = { version = "4.19.0", default-features = false, features = ["z-with-tokio"] }

# The menu-bar icon: tray-icon needs AppKit's run loop on the main thread (tray_mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSRunningApplication"] }
dispatch2 = "0.3.1"
# UNUserNotificationCenter, used directly through its async API: notify-rust's wrapper only
# offers blocking calls, which fail whenever the main run loop is busy at that instant.
# Needs the daemon to run from an app bundle (scripts/build-macos.sh).
mac-usernotifications = { version = "0.3.1", default-features = false }
