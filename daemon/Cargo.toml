[package]
name = "tt-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
ksni = "0.3.7"
notify-rust = { version = "4.19.0", default-features = false, features = ["z-with-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tt-core = { path = "../core" }
