[package]
name = "utre-google"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
chrono = "0.4"
getrandom = "0.4"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "sync", "time"] }
utre-core = { path = "../core" }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
chrono-tz = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
