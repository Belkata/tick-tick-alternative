# Warms the caches the release workflows (macos-release.yml, android-release.yml) restore.
#
# Why a separate workflow: GitHub scopes a cache to the ref that saved it. A run triggered by a
# tag can only read caches from that tag or from the default branch, so whatever a release run
# saves is useless to the next release. Caches saved here, on main, are readable by every tag
# run. The release workflows therefore only restore (same keys), and never save.
#
# Runs when the lockfiles or the release workflows change, weekly (a cache untouched for 7 days
# is evicted), and on demand. The keys below must match the ones in the release workflows.
name: Cache warm

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - app/pubspec.lock
      - app/macos/Podfile.lock
      - app/android/**/*.gradle
      - app/android/**/*.gradle.kts
      - app/android/**/gradle-wrapper.properties
      - .github/workflows/macos-release.yml
      - .github/workflows/android-release.yml
      - .github/workflows/cache-warm.yml
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm-${{ github.ref }}
  # A running warm-up (macOS takes ~20 min) must finish; a newer push only replaces a queued one.
  cancel-in-progress: false

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  macos:
    name: Warm macOS caches
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust 1.100
        run: |
          rustup toolchain install 1.100.0 --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default 1.100.0

      - name: Flutter 3.50.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
          pub-cache-key: pub-${{ hashFiles('app/pubspec.lock') }}

      # target/ for utre-daemon and utre (cargo build --release in build-macos.sh).
      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos-release
          save-if: "true"

      # cargokit's own target dir for the universal bridge (CARGOKIT_TARGET_TEMP_DIR is Xcode's
      # TARGET_TEMP_DIR for the utre_bridge pod) and the installed pods.
      - name: Restore cargokit and Pods
        id: mac-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/build/macos/Build/Intermediates.noindex/Pods.build/Release/utre_bridge.build/aarch64-apple-darwin
            app/build/macos/Build/Intermediates.noindex/Pods.build/Release/utre_bridge.build/x86_64-apple-darwin
            app/macos/Pods
          key: macos-cargokit-pods-${{ hashFiles('Cargo.lock', 'app/macos/Podfile.lock') }}
          restore-keys: macos-cargokit-pods-

      - name: Build Utre.app
        run: scripts/build-macos.sh --no-dmg

      - name: Where cargokit built
        run: |
          du -sh app/build/macos/Build/Intermediates.noindex/Pods.build/Release/utre_bridge.build/* app/macos/Pods target 2>&1 || true

      - name: Save cargokit and Pods
        if: steps.mac-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/build/macos/Build/Intermediates.noindex/Pods.build/Release/utre_bridge.build/aarch64-apple-darwin
            app/build/macos/Build/Intermediates.noindex/Pods.build/Release/utre_bridge.build/x86_64-apple-darwin
            app/macos/Pods
          key: macos-cargokit-pods-${{ hashFiles('Cargo.lock', 'app/macos/Podfile.lock') }}

  android:
    name: Warm Android caches
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Rust 1.100 with the Android targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustup target add aarch64-linux-android

      - name: Flutter 3.50.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
          pub-cache-key: pub-${{ hashFiles('app/pubspec.lock') }}

      - name: Android NDK 28.2
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-36" > /dev/null

      # cargokit's target dir for the Android bridge (the utre_bridge project's build/ dir).
      - name: Restore cargokit
        id: cargokit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/build/utre_bridge/build
          key: android-cargokit-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-cargokit-

      # No key.properties: the template signs with the debug key. Nothing is uploaded.
      - name: Build a release APK to fill the caches
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Where cargokit built
        run: du -sh app/build/utre_bridge/build/* ~/.gradle/caches 2>&1 || true

      - name: Save cargokit
        if: steps.cargokit.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/build/utre_bridge/build
          key: android-cargokit-${{ hashFiles('Cargo.lock') }}
