# Builds the Android APK on version tags and attaches it to a GitHub pre-release
# (plan/10 M4 "APK release via CI"). Tag with: git tag v0.2.0 && git push origin v0.2.0
#
# Signing: a phone only accepts updates signed with the same key, so CI signs with the
# release keystore from these repository secrets (see plan/07 "Release signing"):
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD its store password
#   ANDROID_KEY_ALIAS         the key alias
#   ANDROID_KEY_PASSWORD      the key password
# Without them the workflow skips cleanly (a notice, no failure) rather than publishing an
# APK signed with a throwaway key.
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: the build job only reads; only the publish job may write releases.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    outputs:
      signed: ${{ steps.keys.outputs.signed }}
    steps:
      # Secrets can't be tested in `if:`, so check them here and let later steps key off
      # the output. Nothing is printed.
      - name: Check the signing secrets
        id: keys
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android release skipped::The ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets aren't all set, so no APK was built. See plan/07 \"Release signing\"."
            echo "### Android release skipped: the signing secrets are not set (plan/07 Release signing)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.keys.outputs.signed == 'true'
        with:
          persist-credentials: false

      - name: Java 21
        if: steps.keys.outputs.signed == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Rust 1.100 with the Android targets
        if: steps.keys.outputs.signed == 'true'
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustup target add aarch64-linux-android

      - name: Flutter 3.50.1
        if: steps.keys.outputs.signed == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
          pub-cache-key: pub-${{ hashFiles('app/pubspec.lock') }}

      - name: Android NDK 28.2
        if: steps.keys.outputs.signed == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "platforms;android-36" > /dev/null

      # The keystore lives in RUNNER_TEMP, readable only by us, and is deleted at the end.
      # Saved by cache-warm.yml on main; tag runs only restore. Key must match that workflow.
      - name: Restore cargokit
        if: steps.keys.outputs.signed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/build/utre_bridge/build
          key: android-cargokit-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-cargokit-

      - name: Release keystore from secrets
        if: steps.keys.outputs.signed == 'true'
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build the APK
        if: steps.keys.outputs.signed == 'true'
        working-directory: app
        env:
          UTRE_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.UTRE_GOOGLE_ANDROID_CLIENT_ID }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Remove the keystore
        if: always() && steps.keys.outputs.signed == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks" app/android/key.properties

      - name: Keep the APK for the publish job
        if: steps.keys.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: apk
    if: needs.apk.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk

      - name: Publish a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          cp app-release.apk "utre-${tag}.apk"
          gh release create "$tag" "utre-${tag}.apk" --prerelease --generate-notes \
            || gh release upload "$tag" "utre-${tag}.apk" --clobber
