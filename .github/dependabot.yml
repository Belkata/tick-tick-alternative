# Weekly, grouped, so it stays quiet: at most one PR per ecosystem per week for
# minor/patch updates; majors come as separate PRs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /app
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      pub-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /app/android
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
