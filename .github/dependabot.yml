# Weekly, grouped, so it stays quiet: at most one PR per ecosystem per week for
# minor/patch updates; majors come as separate PRs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    # glib 0.18 comes only from tray-icon's Linux side (gtk-rs 0.18); tray-icon is a macOS-only
    # dependency of the daemon, so glib is never compiled. No version of the tree allows the fixed
    # glib 0.20, so security update attempts always fail (alert 1, plan/11). Revisit when tray-icon
    # moves off gtk-rs 0.18.
    ignore:
      - dependency-name: glib
  - package-ecosystem: pub
    directory: /app
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      pub-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /app/android
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
